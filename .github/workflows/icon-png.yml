name: Generate iPhone icon PNG
on:
  workflow_dispatch:
  push:
    paths:
      - icon.svg
      - .github/workflows/icon-png.yml
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg pillow
      - name: Generate PNG icons
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          svg=open('icon.svg','rb').read()
          for size in (180,192,512):
              data=cairosvg.svg2png(bytestring=svg,output_width=size,output_height=size)
              img=Image.open(BytesIO(data)).convert('RGB')
              img.save(f'icon-{size}.png',optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate PNG app icons" && git push)
