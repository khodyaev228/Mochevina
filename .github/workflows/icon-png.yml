name: Generate iPhone icon PNG
on:
  workflow_dispatch:
  push:
    paths:
      - icon.svg
      - .github/workflows/icon-png.yml
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg pillow
      - name: Generate PNG icons
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          svg=open('icon.svg','rb').read()
          for size in (180,192,512):
              data=cairosvg.svg2png(bytestring=svg,output_width=size,output_height=size)
              img=Image.open(BytesIO(data)).convert('RGB')
              img.save(f'icon-{size}.png',optimize=True)
          import json
          from pathlib import Path
          p=Path('manifest.webmanifest')
          manifest=json.loads(p.read_text())
          manifest['icons']=[{'src':'./icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},{'src':'./icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'}]
          p.write_text(json.dumps(manifest,ensure_ascii=False))
          page=Path('index.html')
          html=page.read_text()
          html=html.replace('href="./icon.svg?v=19"','href="./icon-180.png?v=20"')
          page.write_text(html)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png index.html manifest.webmanifest
          git diff --cached --quiet || (git commit -m "Generate PNG app icons" && git push)
